aid: pawsh
name: Pawsh
description: Pawsh is a consumer marketplace that connects pet owners with top-rated local dog
  and cat groomers. Pet owners browse groomer profiles, read real reviews, compare transparent
  pricing, and book grooming appointments online in minutes. Backed by 500 Global, Pawsh runs as
  a Firebase-backed web application at pawsh.app and serves 2,000+ pet owners. As of this
  enrichment pass the company publishes no public API, developer portal, SDKs, or documentation
  surface — it is a consumer-facing booking platform with no programmable interface to catalog.
